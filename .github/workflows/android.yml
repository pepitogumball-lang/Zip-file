name: Android Mod Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Extract Dependencies
      run: |
        mkdir -p libs
        unzip -q Managed.zip -d libs/

    - name: Build Mod
      run: |
        dotnet build InfiniteCharmsMod.csproj -c Release -o output
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InfiniteCharmsMod-DLL
        path: output/InfiniteCharmsMod.dll